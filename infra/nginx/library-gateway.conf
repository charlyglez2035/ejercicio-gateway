# API Gateway de Library (nginx).
# Se instala en /etc/nginx/conf.d/library-gateway.conf con infra/nginx/install_gateway.sh.
# No depende de la IP de la VM (server_name _): sirve en el puerto 80 de cualquier IP.
#
#   /api/books/...    -> books/soap  :5001   PUBLICO
#   /api/login/...    -> login       :5000   publico solo login|register|refresh|verify-email|health
#   /api/users/...    -> users       :5002   JWT obligatorio
#   /api/authors/...  -> authors     :5003   JWT obligatorio
#   /api/pedidos/...  -> pedidos     :5004   JWT obligatorio (incluye /stock)
#   /api/pagos/...    -> pagos       :5005   JWT obligatorio
#   /api/<svc>/health                        publico (monitoreo)
#   /                 -> web-monolito :3000  (usa su propia sesion de login)
#
# El gateway valida el JWT preguntando a login GET /session (firma, expiracion,
# revocacion y sesion en Redis). Cada microservicio vuelve a validar JWT y rol (403).

limit_req_zone $binary_remote_addr zone=lib_api:10m   rate=20r/s;
limit_req_zone $binary_remote_addr zone=lib_login:10m rate=5r/s;
limit_req_status 429;

upstream lib_login   { server 127.0.0.1:5000; keepalive 16; }
upstream lib_books   { server 127.0.0.1:5001; keepalive 16; }
upstream lib_users   { server 127.0.0.1:5002; keepalive 16; }
upstream lib_authors { server 127.0.0.1:5003; keepalive 16; }
upstream lib_pedidos { server 127.0.0.1:5004; keepalive 16; }
upstream lib_pagos   { server 127.0.0.1:5005; keepalive 16; }
upstream lib_web     { server 127.0.0.1:3000; keepalive 16; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    add_header X-Request-ID $request_id always;

    access_log /var/log/nginx/library-gateway.access.log;
    error_log  /var/log/nginx/library-gateway.error.log warn;

    # ---------- Autenticacion centralizada ----------
    location = /_auth {
        internal;
        proxy_pass http://lib_login/session?format=json;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Connection "";
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Original-URI $request_uri;
    }

    error_page 401 = @unauthorized;
    error_page 403 = @forbidden;

    location @unauthorized {
        default_type application/json;
        add_header WWW-Authenticate 'Bearer realm="library"' always;
        add_header X-Request-ID $request_id always;
        return 401 '{"error":"Se requiere Authorization: Bearer <JWT> valido (gateway)."}';
    }

    location @forbidden {
        default_type application/json;
        add_header X-Request-ID $request_id always;
        return 403 '{"error":"Acceso denegado (gateway)."}';
    }

    location = /gateway/health {
        default_type application/json;
        return 200 '{"status":"ok","gateway":"nginx"}';
    }

    # ---------- Health publico de cada servicio ----------
    location ~ ^/api/(login|users|authors|pedidos|pagos)/health$ {
        proxy_pass http://lib_$1/health$is_args$args;
    }

    # ---------- Books: PUBLICO ----------
    location /api/books/ {
        limit_req zone=lib_api burst=40 nodelay;
        proxy_pass http://lib_books/;
    }

    # ---------- Login ----------
    # Publicos: sin ellos nadie podria obtener un token.
    location ~ ^/api/login/(login|register|refresh)$ {
        limit_req zone=lib_login burst=10 nodelay;
        proxy_pass http://lib_login/$1$is_args$args;
    }
    location = /api/login/verify-email {
        proxy_pass http://lib_login/verify-email$is_args$args;
    }
    # Resto de login (/session, /logout, /apidocs...): protegido.
    location /api/login/ {
        auth_request /_auth;
        limit_req zone=lib_api burst=40 nodelay;
        proxy_pass http://lib_login/;
    }

    # ---------- Microservicios protegidos ----------
    location /api/users/ {
        auth_request /_auth;
        limit_req zone=lib_api burst=40 nodelay;
        proxy_pass http://lib_users/;
    }
    location /api/authors/ {
        auth_request /_auth;
        limit_req zone=lib_api burst=40 nodelay;
        proxy_pass http://lib_authors/;
    }
    location /api/pedidos/ {
        auth_request /_auth;
        limit_req zone=lib_api burst=40 nodelay;
        proxy_pass http://lib_pedidos/;
    }
    location /api/pagos/ {
        auth_request /_auth;
        limit_req zone=lib_api burst=40 nodelay;
        proxy_pass http://lib_pagos/;
    }

    # Cualquier otra ruta /api/ no existe.
    location /api/ {
        default_type application/json;
        return 404 '{"error":"Ruta no encontrada en el gateway."}';
    }

    # ---------- Web monolito ----------
    location / {
        proxy_pass http://lib_web;
    }
}
